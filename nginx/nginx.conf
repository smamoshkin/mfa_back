events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server wb_backend:8000;  # имя сервиса из docker-compose
    }

    server {
        listen 80;
        server_name _;  # замени на свой домен, если есть

        # Статика фронтенда (React)
        #location / {
        #    root /usr/share/nginx/html;
        #    try_files $uri /index.html;
        #}
        location / {
             proxy_pass http://wb_frontend:80;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API запросы перенаправляем на бэкенд
        location /api/ {
            proxy_pass http://wb_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8080;
        }

        # Дополнительные пути, если бэкенд использует не только /api
        location /admin/ {
            proxy_pass http://backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
