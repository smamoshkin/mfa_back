events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server wb_backend:8000;  # имя сервиса из docker-compose
    }

    # --- HTTP: только проверка Let's Encrypt и редирект на HTTPS ---
    server {
        listen 80;
        server_name faapp.ru www.faapp.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: основной сервер ---
    server {
        listen 443 ssl;
        http2 on;
        server_name faapp.ru www.faapp.ru;

        # Запрет индексации (пока сайт не для публичного привлечения пользователей)
        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /\n";
            add_header Content-Type text/plain;
        }
        add_header X-Robots-Tag "noindex, nofollow" always;

        ssl_certificate     /etc/letsencrypt/live/faapp.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/faapp.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Только современные AEAD-шифры (GCM/CHACHA20) — без слабых CBC
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Предпочитаем сильные группы для key exchange
        ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1:prime256v1;

        # Сессии
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # OCSP stapling не используется: Let's Encrypt перешёл на CRL (OCSP-URL в сертификате нет)

        # HSTS: браузер всегда ходит только по https (на домен, IP не затрагивается)
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Фронтенд (React-статика из контейнера wb_frontend)
        location / {
             proxy_pass http://wb_frontend:80;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API запросы перенаправляем на бэкенд
        location /api/ {
            proxy_pass http://wb_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
        }

        # Дополнительные пути, если бэкенд использует не только /api
        location /admin/ {
            proxy_pass http://backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Дашборд статуса прода (защищён basic auth)
        location /status/ {
            alias /usr/share/nginx/status/;
            index index.html;
            auth_basic "MFA Status";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        location = /status { return 301 /status/; }
    }
}
