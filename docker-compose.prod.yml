# Продовый compose: образы приходят из GHCR, на сервере ничего не собирается.
# Переменные (создать в .env на сервере или задать при запуске):
#   BACKEND_TAG / FRONTEND_TAG — теги образов (default: latest)
#   DB_PASSWORD, SECRET_KEY, API_WB_KEY — секреты из .env

services:
  # База данных (PostgreSQL) – используем существующие данные, поэтому volumes важны
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: marketfinance_db
      POSTGRES_USER: marketfinance_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
    networks:
      - wb_network
    ports:
      - "127.0.0.1:5432:5432"   # проброс только на localhost

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    networks:
      - wb_network

  # Бэкенд (FastAPI + gunicorn)
  backend:
    image: ghcr.io/smamoshkin/mfa-backend:${BACKEND_TAG:-latest}
    container_name: wb_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://marketfinance_user:${DB_PASSWORD}@db:5432/marketfinance_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - API_WB_KEY=${API_WB_KEY}
      - ROOT_PATH=/api
    depends_on:
      - db
      - redis
    networks:
      - wb_network
    volumes:
      - ./logs:/app/logs

  # Celery worker
  celery_worker:
    image: ghcr.io/smamoshkin/mfa-backend:${BACKEND_TAG:-latest}
    container_name: wb_celery
    restart: always
    entrypoint: ""
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://marketfinance_user:${DB_PASSWORD}@db:5432/marketfinance_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - db
      - redis
    networks:
      - wb_network

  # Celery Beat — планировщик периодических задач
  celery_beat:
    image: ghcr.io/smamoshkin/mfa-backend:${BACKEND_TAG:-latest}
    container_name: wb_celery_beat
    restart: always
    entrypoint: ""
    command: celery -A app.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      - DATABASE_URL=postgresql://marketfinance_user:${DB_PASSWORD}@db:5432/marketfinance_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - db
      - redis
    volumes:
      - ./celerybeat_data:/app/celerybeat_data
    networks:
      - wb_network

  # Фронтенд (nginx со статикой React)
  frontend:
    image: ghcr.io/smamoshkin/mfa-frontend:${FRONTEND_TAG:-latest}
    container_name: wb_frontend
    restart: always
    networks:
      - wb_network

  # Nginx (входные ворота)
  nginx:
    image: nginx:alpine
    container_name: wb_nginx
    restart: always
    ports:
      - "80:80"      # HTTP: редирект на HTTPS + проверка Let's Encrypt
      - "443:443"    # HTTPS: основной вход
      - "8080:80"    # ВРЕМЕННО: старый вход, убрать после перехода на faapp.ru
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro   # пароль дашборда /status/
      - ./status:/usr/share/nginx/status:ro         # дашборд статуса (генерится health_check.sh)
      - ./ssl/webroot:/var/www/certbot:ro           # challenge-файлы Let's Encrypt
      - ./ssl/letsencrypt:/etc/letsencrypt:ro       # сертификаты (продление: certbot renew)
    depends_on:
      - backend
      - frontend
    networks:
      - wb_network

networks:
  wb_network:
    driver: bridge
